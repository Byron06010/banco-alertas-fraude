<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Alertas - Banco Fraude</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                🛡️ <span>Banco Alertas - Panel de Fraude</span>
            </h1>
            <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs rounded-full">Sistema Activo</span>
        </header>

        <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-6 shadow-xl backdrop-blur-md">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Alertas Recientes de Transacciones</h2>
            <div id="alerts-container" class="space-y-3">
                <p class="text-slate-400 text-center py-6">Cargando alertas...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadAlerts() {
            try {
                const res = await fetch('/api/alerts');
                const alerts = await res.json();
                const container = document.getElementById('alerts-container');
                
                if (alerts.length === 0) {
                    container.innerHTML = '<p class="text-slate-400 text-center py-6">No hay alertas registradas todavía.</p>';
                    return;
                }

                container.innerHTML = alerts.map(alert => `
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg flex justify-between items-center transition hover:border-slate-600">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-bold text-white">Transacción: ${alert.transactionId}</span>
                                <span class="text-xs px-2 py-0.5 rounded ${alert.riskLevel === 'Alto' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">${alert.riskLevel}</span>
                            </div>
                            <p class="text-sm text-slate-300">${alert.description}</p>
                            <span class="text-xs text-slate-500 mt-1 block">${alert.userEmail} • ${new Date(alert.createdAt).toLocaleString()}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-lg font-bold text-emerald-400">$${alert.amount}</span>
                            <span class="block text-xs uppercase tracking-wider text-slate-400 mt-0.5">${alert.status}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('alerts-container').innerHTML = '<p class="text-red-400 text-center py-6">Error al cargar las alertas.</p>';
            }
        }
        loadAlerts();
        setInterval(loadAlerts, 5000);
    </script>
</body>
</html>
